<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OnlineJob Portal - Connecting Ethiopian Youth with Employment Opportunities. Find your dream job in Ethiopia." />
    <meta name="theme-color" content="#0F9D58" />
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('darkMode');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = stored !== null ? JSON.parse(stored) : prefersDark;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>OnlineJob Portal — Ethiopian Youth Job Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Color Blind Simulation SVG Filters (WCAG Accessibility) -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
      <!-- Protanopia (Red-blind) -->
      <filter id="protanopia">
        <feColorMatrix type="matrix" values="
          0.567, 0.433, 0,     0, 0
          0.558, 0.442, 0,     0, 0
          0,     0.242, 0.758, 0, 0
          0,     0,     0,     1, 0"/>
      </filter>
      <!-- Deuteranopia (Green-blind) -->
      <filter id="deuteranopia">
        <feColorMatrix type="matrix" values="
          0.625, 0.375, 0,   0, 0
          0.7,   0.3,   0,   0, 0
          0,     0.3,   0.7, 0, 0
          0,     0,     0,   1, 0"/>
      </filter>
      <!-- Tritanopia (Blue-blind) -->
      <filter id="tritanopia">
        <feColorMatrix type="matrix" values="
          0.95, 0.05,  0,     0, 0
          0,    0.433, 0.567, 0, 0
          0,    0.475, 0.525, 0, 0
          0,    0,     0,     1, 0"/>
      </filter>
    </svg>
  </body>
</html>
