<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OnlineJob Portal — Admin Dashboard UI Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body {
    font-family: 'Inter', 'Poppins', -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #1E293B;
    -webkit-font-smoothing: antialiased;
  }
  .canvas {
    width: 1460px;
    margin: 0 auto;
    padding: 12px 0;
    display: grid;
    grid-template-columns: repeat(3, 470px);
    grid-template-rows: repeat(3, 335px);
    gap: 25px;
    justify-content: center;
  }
  .card {
    background: #ffffff;
    border-radius: 12px;
    border: 1px solid #E7EAEE;
    box-shadow: 0 6px 18px rgba(30, 41, 59, 0.07), 0 1px 3px rgba(30, 41, 59, 0.04);
    display: flex;
    overflow: hidden;
  }
  /* ---------- Sidebar ---------- */
  .sb {
    flex: 0 0 150px;
    background: #FDFEFE;
    border-right: 1px solid #EEF1F4;
    padding: 13px 10px 10px;
    display: flex;
    flex-direction: column;
  }
  .admin-badge {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #2BC48B;
    color: #0E7D5B;
    font-size: 7.5px;
    font-weight: 800;
    letter-spacing: 0.16em;
    line-height: 1;
    padding: 3px 7px 3px 8px;
    border-radius: 999px;
    margin: 1px 0 12px 2px;
    background: #F4FDF9;
  }
  .menu { display: flex; flex-direction: column; gap: 7px; }
  .item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 8px;
    font-size: 9.5px;
    font-weight: 500;
    color: #5C6B76;
    letter-spacing: 0.01em;
    white-space: nowrap;
    cursor: default;
  }
  .item svg { width: 13px; height: 13px; flex-shrink: 0; }
  .item .lbl { flex: 1; }
  .item .count {
    margin-left: 2px;
    background: #0E7D5B;
    color: #ffffff;
    font-size: 7px;
    font-weight: 800;
    border-radius: 999px;
    min-width: 12px;
    height: 12px;
    padding: 0 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .item.sel {
    background: var(--accent);
    color: #ffffff;
    font-weight: 600;
    box-shadow: 0 2px 7px rgba(30, 41, 59, 0.14);
  }
  .item.sel svg { color: #ffffff; }
  /* ---------- Card content ---------- */
  .cv {
    flex: 1;
    padding: 16px 15px 12px;
    display: flex;
    flex-direction: column;
    background: var(--grad);
  }
  .cv h2 {
    font-size: 14.5px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--title);
    font-family: 'Poppins', 'Inter', sans-serif;
  }
  .illus { margin-top: auto; width: 100%; height: auto; display: block; }
</style>
</head>
