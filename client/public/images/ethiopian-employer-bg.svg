<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Ethiopian Forest Green & Rich Charcoal Gradient Base -->
    <linearGradient id="forestCharcoalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081E17"/>
      <stop offset="35%" stop-color="#0F382C"/>
      <stop offset="70%" stop-color="#164E3D"/>
      <stop offset="100%" stop-color="#0E241D"/>
    </linearGradient>

    <!-- Emerald & Gold Corporate Accents -->
    <linearGradient id="emeraldGoldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Dignified Dark Glow -->
    <radialGradient id="forestGlow" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#0F382C" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ethiopian Traditional Border Geometric Lattice -->
    <pattern id="employerBorderPattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 0 40 L 40 0 L 80 40 L 40 80 Z" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.08"/>
      <rect x="25" y="25" width="30" height="30" fill="none" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.07" transform="rotate(45 40 40)"/>
      <circle cx="40" cy="40" r="4" fill="#34D399" fill-opacity="0.1"/>
    </pattern>

    <!-- Ethiopian Cross / Star Geometric Motif -->
    <g id="ethiopianCorporateMotif">
      <path d="M 0,-20 L 6,-6 L 20,0 L 6,6 L 0,20 L -6,6 L -20,0 L -6,-6 Z" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.25"/>
      <circle cx="0" cy="0" r="3" fill="#10B981" fill-opacity="0.3"/>
    </g>
  </defs>

  <!-- Background Base -->
  <rect width="1440" height="900" fill="url(#forestCharcoalGradient)"/>
  
  <!-- Radial Glow -->
  <rect width="1440" height="900" fill="url(#forestGlow)"/>

  <!-- Geometric Pattern Overlay -->
  <rect width="1440" height="900" fill="url(#employerBorderPattern)"/>

  <!-- Top Cultural Motif Ribbon (Traditional Green, Gold, Red Subtle Stripes) -->
  <g opacity="0.5">
    <rect x="0" y="0" width="1440" height="5" fill="#009A44"/>
    <rect x="0" y="5" width="1440" height="4" fill="#FED100"/>
    <rect x="0" y="9" width="1440" height="4" fill="#C8102E"/>
  </g>

  <!-- Business Collaboration & Enterprise Growth Nodes (Right Visual Area) -->
  <g transform="translate(900, 100)" stroke-linecap="round">
    <!-- Interlocking Strategic Rings -->
    <circle cx="260" cy="240" r="210" fill="none" stroke="url(#emeraldGoldGradient)" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="12 8"/>
    <circle cx="260" cy="240" r="280" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.12"/>

    <!-- Collaborative Network Links -->
    <g stroke="url(#emeraldGoldGradient)" stroke-width="2" stroke-opacity="0.35">
      <line x1="120" y1="320" x2="220" y2="200"/>
      <line x1="220" y1="200" x2="340" y2="260"/>
      <line x1="220" y1="200" x2="260" y2="100"/>
      <line x1="340" y1="260" x2="420" y2="160"/>
    </g>

    <!-- Enterprise Nodes -->
    <circle cx="120" cy="320" r="10" fill="#0F382C" stroke="#10B981" stroke-width="2"/>
    <circle cx="220" cy="200" r="14" fill="#10B981" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="340" cy="260" r="11" fill="#D4AF37" stroke="#34D399" stroke-width="2"/>
    <circle cx="260" cy="100" r="12" fill="#34D399" stroke="#0F382C" stroke-width="2"/>
    <circle cx="420" cy="160" r="15" fill="#D4AF37" stroke="#10B981" stroke-width="2"/>
  </g>

  <!-- Ethiopian Dignified Motifs Floating -->
  <use href="#ethiopianCorporateMotif" x="140" y="750" transform="scale(1.5)"/>
  <use href="#ethiopianCorporateMotif" x="1280" y="780" transform="scale(1.3)"/>
  <use href="#ethiopianCorporateMotif" x="80" y="160" transform="scale(1.1)"/>

  <!-- Left Traditional Border Accent Frame -->
  <g transform="translate(30, 280)" opacity="0.3">
    <line x1="0" y1="0" x2="0" y2="300" stroke="#D4AF37" stroke-width="2" stroke-dasharray="10 5"/>
    <line x1="8" y1="20" x2="8" y2="280" stroke="#10B981" stroke-width="1.5"/>
  </g>
</svg>
