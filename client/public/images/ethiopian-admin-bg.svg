<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sleek Deep Navy & Dark Slate Gradient Base -->
    <linearGradient id="adminNavyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060C1E"/>
      <stop offset="35%" stop-color="#0B132B"/>
      <stop offset="70%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>

    <!-- Indigo, Gold & Cyan Tech Accents -->
    <linearGradient id="adminAccentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A506B"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Radial Oversight Glow -->
    <radialGradient id="adminGlow" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#1C2541" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Axumite Geometric Architectural Lattice Pattern -->
    <pattern id="axumiteLatticePattern" width="60" height="90" patternUnits="userSpaceOnUse">
      <!-- Axum Stela Pillar Geometric Lines -->
      <rect x="15" y="0" width="30" height="90" fill="none" stroke="#3A506B" stroke-width="0.8" stroke-opacity="0.12"/>
      <line x1="15" y1="30" x2="45" y2="30" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.1"/>
      <line x1="15" y1="60" x2="45" y2="60" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.1"/>
      <!-- Semi-circular Top Arch Motif of Axumite Stelae -->
      <path d="M 15 15 Q 30 0 45 15" fill="none" stroke="#00B4D8" stroke-width="1" stroke-opacity="0.15"/>
      <path d="M 15 45 Q 30 30 45 45" fill="none" stroke="#00B4D8" stroke-width="0.8" stroke-opacity="0.1"/>
      <circle cx="30" cy="75" r="3" fill="#D4AF37" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1440" height="900" fill="url(#adminNavyGradient)"/>
  
  <!-- Radial Glow -->
  <rect width="1440" height="900" fill="url(#adminGlow)"/>

  <!-- Axumite Architectural Lattice Pattern Overlay -->
  <rect width="1440" height="900" fill="url(#axumiteLatticePattern)"/>

  <!-- Subtle Gold Top Ribbon Frame -->
  <g opacity="0.6">
    <rect x="0" y="0" width="1440" height="4" fill="#D4AF37"/>
    <rect x="0" y="4" width="1440" height="2" fill="#00B4D8"/>
  </g>

  <!-- Axumite Stela Geometric Pillar Outline (Left Side) -->
  <g transform="translate(80, 100)" stroke="#D4AF37" stroke-opacity="0.12" fill="none">
    <rect x="0" y="0" width="60" height="700" stroke-width="1.5"/>
    <path d="M 0 0 Q 30 -40 60 0" stroke-width="2"/>
    <line x1="0" y1="100" x2="60" y2="100" stroke-width="1"/>
    <line x1="0" y1="200" x2="60" y2="200" stroke-width="1"/>
    <line x1="0" y1="300" x2="60" y2="300" stroke-width="1"/>
    <line x1="0" y1="400" x2="60" y2="400" stroke-width="1"/>
    <line x1="0" y1="500" x2="60" y2="500" stroke-width="1"/>
    <line x1="0" y1="600" x2="60" y2="600" stroke-width="1"/>
  </g>

  <!-- Right Side System Oversight & Data Mesh Visual -->
  <g transform="translate(850, 80)" stroke-linecap="round">
    <!-- Concentric Command Rings -->
    <circle cx="280" cy="280" r="240" fill="none" stroke="url(#adminAccentGradient)" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="16 10"/>
    <circle cx="280" cy="280" r="180" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="280" cy="280" r="300" fill="none" stroke="#3A506B" stroke-width="0.8" stroke-opacity="0.15"/>

    <!-- Administrative Data Grid Radar Lines -->
    <g stroke="url(#adminAccentGradient)" stroke-opacity="0.2" stroke-width="1">
      <line x1="40" y1="280" x2="520" y2="280"/>
      <line x1="280" y1="40" x2="280" y2="520"/>
      <line x1="110" y1="110" x2="450" y2="450"/>
      <line x1="450" y1="110" x2="110" y2="450"/>
    </g>

    <!-- Glowing Control Points -->
    <circle cx="280" cy="100" r="7" fill="#00B4D8"/>
    <circle cx="460" cy="280" r="8" fill="#D4AF37"/>
    <circle cx="280" cy="460" r="6" fill="#3A506B"/>
    <circle cx="100" cy="280" r="7" fill="#00B4D8"/>
    <circle cx="390" cy="170" r="9" fill="#D4AF37"/>
  </g>

  <!-- Bottom Axumite Geometric Motif Frame -->
  <g transform="translate(100, 820)" opacity="0.25">
    <rect x="0" y="0" width="40" height="40" fill="none" stroke="#D4AF37" stroke-width="1.5" transform="rotate(45 20 20)"/>
    <rect x="60" y="0" width="40" height="40" fill="none" stroke="#00B4D8" stroke-width="1.5" transform="rotate(45 80 20)"/>
    <rect x="120" y="0" width="40" height="40" fill="none" stroke="#D4AF37" stroke-width="1.5" transform="rotate(45 140 20)"/>
  </g>
</svg>
