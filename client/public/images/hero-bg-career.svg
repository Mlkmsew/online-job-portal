<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08244F"/>
      <stop offset="0.45" stop-color="#0D3B7D"/>
      <stop offset="0.75" stop-color="#0E5E9E"/>
      <stop offset="1" stop-color="#1288C4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B2E5C"/>
      <stop offset="1" stop-color="#04101F"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.78" cy="0.18" r="0.45">
      <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.18" cy="0.78" r="0.5">
      <stop offset="0" stop-color="#26C6DA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#26C6DA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.3" r="0.4">
      <stop offset="0" stop-color="#90CAF9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#90CAF9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#1769E0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Depth glows -->
  <rect width="1920" height="1080" fill="url(#glowA)"/>
  <rect width="1920" height="1080" fill="url(#glowB)"/>
  <rect width="1920" height="1080" fill="url(#glowC)"/>

  <!-- Subtle dot grid -->
  <g fill="#9BD5FF" opacity="0.10">
    <circle cx="180" cy="120" r="2"/><circle cx="330" cy="160" r="2"/><circle cx="520" cy="110" r="2"/>
    <circle cx="700" cy="150" r="2"/><circle cx="860" cy="90" r="2"/><circle cx="1040" cy="140" r="2"/>
    <circle cx="1220" cy="100" r="2"/><circle cx="1400" cy="160" r="2"/><circle cx="1580" cy="120" r="2"/>
    <circle cx="1760" cy="90" r="2"/><circle cx="240" cy="300" r="2"/><circle cx="420" cy="260" r="2"/>
    <circle cx="600" cy="320" r="2"/><circle cx="900" cy="280" r="2"/><circle cx="1100" cy="320" r="2"/>
    <circle cx="1300" cy="260" r="2"/><circle cx="1500" cy="300" r="2"/><circle cx="1700" cy="260" r="2"/>
    <circle cx="300" cy="460" r="2"/><circle cx="500" cy="420" r="2"/><circle cx="700" cy="470" r="2"/>
    <circle cx="950" cy="440" r="2"/><circle cx="1200" cy="470" r="2"/><circle cx="1450" cy="420" r="2"/>
    <circle cx="1650" cy="470" r="2"/><circle cx="1850" cy="430" r="2"/>
  </g>

  <!-- Recruitment network: nodes + connections -->
  <g fill="none" stroke="#8FD0FF" stroke-opacity="0.22" stroke-width="1.6" filter="url(#soft)">
    <path d="M340 210 L560 330 L700 250"/>
    <path d="M700 250 L980 420 L1260 300"/>
    <path d="M1260 300 L1540 430 L1760 330"/>
    <path d="M700 250 L900 130"/>
    <path d="M900 130 L1260 300"/>
    <path d="M340 210 L500 80"/>
    <path d="M1760 330 L1620 180"/>
    <path d="M1260 300 L1430 160"/>
    <path d="M560 330 L760 470 L980 420"/>
    <path d="M980 420 L1150 560 L1540 430"/>
    <path d="M1540 430 L1700 590"/>
  </g>
  <g fill="#BFE3FF" opacity="0.85">
    <circle cx="340" cy="210" r="4.5"/><circle cx="560" cy="330" r="4.5"/><circle cx="700" cy="250" r="5.5"/>
    <circle cx="900" cy="130" r="4.5"/><circle cx="980" cy="420" r="4.5"/><circle cx="1260" cy="300" r="5.5"/>
    <circle cx="1540" cy="430" r="4.5"/><circle cx="1760" cy="330" r="4.5"/><circle cx="500" cy="80" r="4"/>
    <circle cx="1620" cy="180" r="4"/><circle cx="1430" cy="160" r="4"/><circle cx="760" cy="470" r="4"/>
    <circle cx="1150" cy="560" r="4"/><circle cx="1700" cy="590" r="4"/>
  </g>

  <!-- Floating UI cards -->
  <!-- Job posting card (left) -->
  <g transform="translate(180,430)" opacity="0.85">
    <rect width="300" height="150" rx="18" fill="url(#cardGrad)" stroke="#BFE3FF" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="18" y="18" width="46" height="46" rx="10" fill="#4FC3F7" opacity="0.35"/>
    <rect x="30" y="30" width="22" height="22" rx="4" fill="none" stroke="#E3F4FF" stroke-opacity="0.9" stroke-width="2.5"/>
    <rect x="78" y="26" width="120" height="10" rx="5" fill="#E3F4FF" opacity="0.5"/>
    <rect x="78" y="44" width="160" height="8" rx="4" fill="#E3F4FF" opacity="0.25"/>
    <rect x="18" y="82" width="64" height="22" rx="11" fill="#E3F4FF" opacity="0.14" stroke="#BFE3FF" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="92" y="82" width="72" height="22" rx="11" fill="#E3F4FF" opacity="0.14" stroke="#BFE3FF" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="18" y="116" width="120" height="20" rx="10" fill="url(#barGrad)" opacity="0.75"/>
  </g>

  <!-- Growth chart card (right) -->
  <g transform="translate(1490,520)" opacity="0.85">
    <rect width="270" height="190" rx="18" fill="url(#cardGrad)" stroke="#BFE3FF" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="18" y="18" width="44" height="44" rx="10" fill="#26C6DA" opacity="0.3"/>
    <path d="M32 46 l12 -12 l8 8 l14 -18" fill="none" stroke="#E3F4FF" stroke-opacity="0.95" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="66,24 76,16 78,28" fill="#E3F4FF" opacity="0.95"/>
    <rect x="78" y="26" width="140" height="10" rx="5" fill="#E3F4FF" opacity="0.5"/>
    <rect x="78" y="44" width="110" height="8" rx="4" fill="#E3F4FF" opacity="0.25"/>
    <g opacity="0.85">
      <rect x="24" y="96" width="30" height="34" rx="6" fill="url(#barGrad)" opacity="0.5"/>
      <rect x="66" y="82" width="30" height="48" rx="6" fill="url(#barGrad)" opacity="0.65"/>
      <rect x="108" y="108" width="30" height="22" rx="6" fill="url(#barGrad)" opacity="0.4"/>
      <rect x="150" y="72" width="30" height="58" rx="6" fill="url(#barGrad)" opacity="0.8"/>
      <rect x="192" y="92" width="30" height="38" rx="6" fill="url(#barGrad)" opacity="0.55"/>
      <rect x="24" y="134" width="198" height="6" rx="3" fill="#E3F4FF" opacity="0.2"/>
    </g>
    <rect x="24" y="156" width="90" height="18" rx="9" fill="url(#barGrad)" opacity="0.6"/>
  </g>

  <!-- Profile / candidate card (center-right) -->
  <g transform="translate(1010,120)" opacity="0.8">
    <rect width="250" height="130" rx="16" fill="url(#cardGrad)" stroke="#BFE3FF" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="22" fill="#4FC3F7" opacity="0.3"/>
    <circle cx="40" cy="35" r="8" fill="#E3F4FF" opacity="0.8"/>
    <path d="M22 60 a18 18 0 0 1 36 0 z" fill="#E3F4FF" opacity="0.7"/>
    <rect x="76" y="28" width="120" height="9" rx="4.5" fill="#E3F4FF" opacity="0.5"/>
    <rect x="76" y="46" width="90" height="7" rx="3.5" fill="#E3F4FF" opacity="0.25"/>
    <rect x="20" y="84" width="52" height="20" rx="10" fill="#E3F4FF" opacity="0.14" stroke="#BFE3FF" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="82" y="84" width="52" height="20" rx="10" fill="#E3F4FF" opacity="0.14" stroke="#BFE3FF" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="144" y="84" width="52" height="20" rx="10" fill="#E3F4FF" opacity="0.14" stroke="#BFE3FF" stroke-opacity="0.35" stroke-width="1"/>
  </g>

  <!-- Handshake / success badge (bottom left) -->
  <g transform="translate(560,150)" opacity="0.75">
    <rect width="120" height="120" rx="24" fill="url(#cardGrad)" stroke="#BFE3FF" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="30" fill="none" stroke="#4FC3F7" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="M42 66 l8 -8 l6 6 l8 -10 l6 6 l8 -8" fill="none" stroke="#E3F4FF" stroke-opacity="0.9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 74 l34 0" stroke="#E3F4FF" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Office skyline silhouette -->
  <g>
    <path fill="url(#floor)" d="M0 840 L0 1080 L1920 1080 L1920 840 L1860 782 L1790 848 L1720 806 L1660 876 L1580 810 L1510 872 L1440 832 L1370 890 L1300 826 L1230 884 L1160 848 L1090 906 L1030 838 L960 892 L890 852 L830 910 L760 846 L700 884 L640 856 L580 912 L510 858 L450 888 L390 852 L320 902 L260 856 L200 876 L130 848 L60 892 L0 862 Z"/>
    <g fill="#5FA8E8" opacity="0.10">
      <rect x="60" y="870" width="20" height="20" rx="2"/>
      <rect x="130" y="860" width="20" height="20" rx="2"/>
      <rect x="200" y="890" width="20" height="20" rx="2"/>
      <rect x="260" y="870" width="20" height="20" rx="2"/>
      <rect x="390" y="865" width="20" height="20" rx="2"/>
      <rect x="510" y="872" width="20" height="20" rx="2"/>
      <rect x="640" y="868" width="20" height="20" rx="2"/>
      <rect x="760" y="860" width="20" height="20" rx="2"/>
      <rect x="890" y="866" width="20" height="20" rx="2"/>
      <rect x="1030" y="850" width="20" height="20" rx="2"/>
      <rect x="1160" y="860" width="20" height="20" rx="2"/>
      <rect x="1300" y="840" width="20" height="20" rx="2"/>
      <rect x="1440" y="846" width="20" height="20" rx="2"/>
      <rect x="1580" y="824" width="20" height="20" rx="2"/>
      <rect x="1720" y="818" width="20" height="20" rx="2"/>
    </g>
  </g>

  <!-- Soft vignette for readability -->
  <rect width="1920" height="1080" fill="url(#sky)" opacity="0.05"/>
</svg>
