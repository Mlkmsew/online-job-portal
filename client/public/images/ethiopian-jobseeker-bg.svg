<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Rich Ethiopian Coffee & Terracotta Gradient Base -->
    <linearGradient id="coffeeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231410"/>
      <stop offset="35%" stop-color="#3D2119"/>
      <stop offset="70%" stop-color="#542B1F"/>
      <stop offset="100%" stop-color="#2D1711"/>
    </linearGradient>

    <!-- Warm Gold Gradient for Accents -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F3E5AB" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C59B27" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Terracotta Glow -->
    <radialGradient id="terracottaGlow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#C85A32" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#7A2D13" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ethiopian Tibeb Diamond Woven Pattern -->
    <pattern id="tibebPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 60 30 L 30 60 L 0 30 Z" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.07"/>
      <path d="M 30 10 L 50 30 L 30 50 L 10 30 Z" fill="none" stroke="#C85A32" stroke-width="0.8" stroke-opacity="0.09"/>
      <circle cx="30" cy="30" r="3" fill="#D4AF37" fill-opacity="0.12"/>
      <path d="M 0 0 L 15 15 M 45 15 L 60 0 M 60 60 L 45 45 M 15 45 L 0 60" stroke="#D4AF37" stroke-width="0.7" stroke-opacity="0.05"/>
    </pattern>

    <!-- Coffee Bean Subtle Motif -->
    <g id="coffeeBean">
      <path d="M 0,-15 C 10,-15 15,-5 15,0 C 15,10 5,15 0,15 C -10,15 -15,5 -15,0 C -15,-10 -5,-15 0,-15 Z" fill="none" stroke="#D4AF37" stroke-opacity="0.15" stroke-width="1.5"/>
      <path d="M 0,-13 C 3,-6 -3,6 0,13" fill="none" stroke="#D4AF37" stroke-opacity="0.2" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- Background Rect -->
  <rect width="1440" height="900" fill="url(#coffeeGradient)"/>
  
  <!-- Subtle Radial Glows -->
  <rect width="1440" height="900" fill="url(#terracottaGlow)"/>

  <!-- Tibeb Woven Pattern Overlay -->
  <rect width="1440" height="900" fill="url(#tibebPattern)"/>

  <!-- Ethiopian Traditional Border Stripes (Top Header Accents) -->
  <g opacity="0.4">
    <!-- Top Tibeb Ribbon -->
    <rect x="0" y="0" width="1440" height="6" fill="#C85A32"/>
    <rect x="0" y="6" width="1440" height="4" fill="#D4AF37"/>
    <rect x="0" y="10" width="1440" height="4" fill="#1B4D3E"/>
  </g>

  <!-- Abstract Career Growth & Modern Workspace Graphics (Right Side Visual) -->
  <g transform="translate(950, 120)" stroke-linecap="round">
    <!-- Concentric Growth Circles -->
    <circle cx="200" cy="200" r="180" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-opacity="0.12" stroke-dasharray="8 6"/>
    <circle cx="200" cy="200" r="240" fill="none" stroke="#C85A32" stroke-width="1.5" stroke-opacity="0.08"/>
    <circle cx="200" cy="200" r="300" fill="none" stroke="url(#goldGradient)" stroke-width="0.8" stroke-opacity="0.05"/>

    <!-- Dynamic Career Ascending Nodes -->
    <path d="M 50 350 Q 150 250 220 180 T 380 60" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-opacity="0.4"/>
    <circle cx="50" cy="350" r="6" fill="#C85A32"/>
    <circle cx="140" cy="260" r="8" fill="#D4AF37"/>
    <circle cx="220" cy="180" r="10" fill="#F3E5AB"/>
    <circle cx="310" cy="110" r="7" fill="#C85A32"/>
    <circle cx="380" cy="60" r="12" fill="#D4AF37"/>

    <!-- Subtle Rays / Sunburst representing Bright Ethiopian Future -->
    <g stroke="url(#goldGradient)" stroke-opacity="0.08" stroke-width="1">
      <line x1="200" y1="200" x2="380" y2="40"/>
      <line x1="200" y1="200" x2="420" y2="120"/>
      <line x1="200" y1="200" x2="430" y2="220"/>
      <line x1="200" y1="200" x2="390" y2="310"/>
      <line x1="200" y1="200" x2="300" y2="380"/>
    </g>
  </g>

  <!-- Coffee Culture Subtle Floating Motifs -->
  <use href="#coffeeBean" x="120" y="780" transform="scale(1.2)"/>
  <use href="#coffeeBean" x="280" y="820" transform="scale(0.9) rotate(25)"/>
  <use href="#coffeeBean" x="1320" y="720" transform="scale(1.1) rotate(-15)"/>

  <!-- Left Bottom Geometric Tibeb Accent Frame -->
  <g transform="translate(40, 680)" opacity="0.35">
    <polygon points="0,150 40,110 80,150 40,190" fill="none" stroke="#D4AF37" stroke-width="2"/>
    <polygon points="40,110 80,70 120,110 80,150" fill="none" stroke="#C85A32" stroke-width="1.5"/>
    <polygon points="80,150 120,110 160,150 120,190" fill="none" stroke="#D4AF37" stroke-width="2"/>
  </g>
</svg>
